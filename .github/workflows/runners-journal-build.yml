name: Runners Journal build

on:
  push:
    paths:
      - "runners-journal/**"
      - "common/**"
      - "common-config-portal/**"
      - "common-sd-web/**"
      - "image_pipeline/**"
      - ".github/workflows/runners-journal-build.yml"
  pull_request:
    paths:
      - "runners-journal/**"
      - "common/**"
      - "common-config-portal/**"
      - "common-sd-web/**"
      - "image_pipeline/**"
      - ".github/workflows/runners-journal-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: runners-journal

jobs:
  build:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment:
          - reterminal_e1005

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio intelhex

      - name: Generate include/secrets.h from repository secrets
        env:
          WIFI_SSID: ${{ secrets.WIFI_SSID }}
          WIFI_PASSWORD: ${{ secrets.WIFI_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "${WIFI_SSID}" ] && [ -n "${WIFI_PASSWORD}" ] && [ -n "${SUPABASE_ANON_KEY}" ]; then
            echo "Generating include/secrets.h from repository secrets."
            cat > include/secrets.h <<EOF
          #pragma once

          #define WIFI_SSID "${WIFI_SSID}"
          #define WIFI_PASSWORD "${WIFI_PASSWORD}"

          #define SUPABASE_ANON_KEY "${SUPABASE_ANON_KEY}"
          EOF
          else
            echo "Falling back to include/secrets.h.example (no/missing repository secrets)."
            cp include/secrets.h.example include/secrets.h
          fi

      - name: Build
        run: pio run -e "${{ matrix.environment }}"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: |
            runners-journal/.pio/build/${{ matrix.environment }}/firmware.bin
            runners-journal/.pio/build/${{ matrix.environment }}/bootloader.bin
            runners-journal/.pio/build/${{ matrix.environment }}/partitions.bin
          if-no-files-found: error
          retention-days: 14
